<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body { margin: 0; padding: 24px 28px; }</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Button, IconButton } = window.ClaudeDesignSystem_2580a7;
const row = { display: "flex", alignItems: "center", gap: 16, marginBottom: 18, flexWrap: "wrap" };
const k = { width: 92, flexShrink: 0, fontFamily: "var(--font-mono)", fontSize: "0.64rem", letterSpacing: "0.08em", textTransform: "uppercase", color: "var(--ink-300)" };
ReactDOM.createRoot(document.getElementById("root")).render(
  <div>
    <div style={row}>
      <span style={k}>Primary</span>
      <Button arrow>ドキュメントを見る</Button>
      <Button size="sm">はじめる</Button>
      <Button disabled>無効</Button>
    </div>
    <div style={row}>
      <span style={k}>Secondary</span>
      <Button variant="secondary">キャンセル</Button>
      <Button variant="secondary" size="sm">戻る</Button>
    </div>
    <div style={row}>
      <span style={k}>Quiet</span>
      <Button variant="quiet">設計原則を読む</Button>
    </div>
    <div style={{ ...row, marginBottom: 0 }}>
      <span style={k}>Icon</span>
      <IconButton label="閉じる">&times;</IconButton>
      <IconButton label="次へ" variant="outline">&rarr;</IconButton>
      <IconButton label="ブランド" variant="outline"><span style={{ color: "var(--accent)" }}>&#10035;</span></IconButton>
    </div>
  </div>
);
</script>
</body>
</html>
