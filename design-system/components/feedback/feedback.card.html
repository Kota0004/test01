<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body { margin: 0; padding: 24px 28px; }</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Alert, Toast, Tooltip, Dialog, Button } = window.ClaudeDesignSystem_2580a7;
function Demo() {
  const [open, setOpen] = React.useState(false);
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
        <Alert tone="success" title="保存しました">変更は即座に反映されます。</Alert>
        <Alert tone="error" title="送信できませんでした">時間をおいて再度お試しください。</Alert>
      </div>
      <div style={{ display: "flex", alignItems: "center", gap: 16, flexWrap: "wrap" }}>
        <Toast tone="success">リンクをコピーしました</Toast>
        <Tooltip label="ツールチップ"><Button variant="secondary" size="sm">hover me</Button></Tooltip>
        <Button size="sm" onClick={() => setOpen(true)}>ダイアログを開く</Button>
      </div>
      <Dialog
        open={open}
        title="変更の保存"
        onClose={() => setOpen(false)}
        footer={
          <React.Fragment>
            <Button variant="secondary" size="sm" onClick={() => setOpen(false)}>キャンセル</Button>
            <Button size="sm" onClick={() => setOpen(false)}>保存する</Button>
          </React.Fragment>
        }
      >
        この変更を保存しますか?保存後も編集を続けられます。
      </Dialog>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
