<!-- @dsCard group="Type" viewport="700x190" name="Eyebrow + Heading" subtitle="見出しの上の小さな大文字ラベルが定番パターン" -->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
body { margin: 0; padding: 26px 28px; }
.eyebrow { font-size: var(--text-eyebrow); font-weight: 500; letter-spacing: 0.15em; text-transform: uppercase; color: var(--text-secondary); }
.eyebrow .tick { color: var(--accent); margin-right: 0.6em; }
h2 { font-family: var(--font-display); font-size: 34px; font-weight: 500; line-height: 1.25; letter-spacing: 0.01em; margin: 14px 0 0; }
.spec { margin-top: 12px; font-family: var(--font-mono); font-size: 0.66rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-300); }
</style>
</head>
<body>
<p class="eyebrow"><span class="tick">&#10035;</span>Principles</p>
<h2>四つの原則が、すべてを決める。</h2>
<p class="spec">Eyebrow — 12px / ls 0.15em / uppercase &middot; tick は accent</p>
</body>
</html>
