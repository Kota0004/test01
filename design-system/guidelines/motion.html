<!-- @dsCard group="Motion" viewport="700x190" name="Motion — 2 種類だけ" subtitle="リビール 700ms + ホバー 150ms。それ以外は動かさない" -->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
body { margin: 0; padding: 22px 28px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.demo { border: 1px solid var(--border); border-radius: var(--radius-md); padding: 18px 20px; }
.demo h3 { font-family: var(--font-display); font-size: 1.1rem; font-weight: 500; margin: 0 0 6px; }
.demo p { margin: 0; font-size: 0.78rem; color: var(--text-secondary); line-height: 1.7; }
.demo .spec { display: block; margin-top: 10px; font-family: var(--font-mono); font-size: 0.64rem; letter-spacing: 0.08em; color: var(--ink-300); text-transform: uppercase; }
.reveal { opacity: 0; transform: translateY(24px); animation: reveal 700ms var(--ease-out-expo) 300ms forwards; }
@keyframes reveal { to { opacity: 1; transform: none; } }
.hoverable { transition: background var(--duration-fast) var(--ease-out-expo); cursor: pointer; }
.hoverable:hover { background: var(--bg-secondary); }
@media (prefers-reduced-motion: reduce) { .reveal { animation: none; opacity: 1; transform: none; } }
</style>
</head>
<body>
<div class="demo reveal">
<h3>Reveal</h3>
<p>opacity 0→1 + translateY(24px→0)。スクロールで 1 回だけ。</p>
<span class="spec">700ms &middot; cubic-bezier(0.16, 1, 0.3, 1)</span>
</div>
<div class="demo hoverable">
<h3>Hover</h3>
<p>色または opacity / transform のみ。ホバーしてみてください。</p>
<span class="spec">150ms &middot; ease-out-expo</span>
</div>
</body>
</html>
