<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
body { margin: 0; padding: 22px 24px; }
.row { display: flex; align-items: baseline; justify-content: space-between; gap: 24px; padding: 10px 0; border-bottom: 1px solid var(--border); }
.row:last-child { border-bottom: none; }
.sample { font-family: var(--font-display); font-weight: 500; line-height: 1.1; letter-spacing: 0.01em; }
.spec { flex-shrink: 0; font-family: var(--font-mono); font-size: 0.66rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-300); }
</style>
</head>
<body>
<div class="row"><span class="sample" style="font-size: 58px;">永い余白</span><span class="spec">Display 2XL — clamp(48–92)</span></div>
<div class="row"><span class="sample" style="font-size: 38px; line-height: 1.25;">静けさの設計</span><span class="spec">Display XL — clamp(36–60)</span></div>
<div class="row"><span class="sample" style="font-size: 28px; line-height: 1.4;">見出しのための明朝体</span><span class="spec">Heading — 28 / 500</span></div>
</body>
</html>
