<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
body { margin: 0; padding: 22px 28px; }
.row { display: flex; align-items: center; gap: 16px; margin-bottom: 8px; }
.bar { height: 14px; background: var(--terracotta-500); border-radius: 2px; opacity: 0.85; }
.k { width: 110px; font-family: var(--font-mono); font-size: 0.68rem; letter-spacing: 0.08em; color: var(--ink-500); text-transform: uppercase; }
</style>
</head>
<body>
<div class="row"><span class="k">space-1 &middot; 4</span><div class="bar" style="width: 4px;"></div></div>
<div class="row"><span class="k">space-2 &middot; 8</span><div class="bar" style="width: 8px;"></div></div>
<div class="row"><span class="k">space-3 &middot; 12</span><div class="bar" style="width: 12px;"></div></div>
<div class="row"><span class="k">space-4 &middot; 16</span><div class="bar" style="width: 16px;"></div></div>
<div class="row"><span class="k">space-6 &middot; 24</span><div class="bar" style="width: 24px;"></div></div>
<div class="row"><span class="k">space-8 &middot; 32</span><div class="bar" style="width: 32px;"></div></div>
<div class="row"><span class="k">space-12 &middot; 48</span><div class="bar" style="width: 48px;"></div></div>
<div class="row"><span class="k">space-16 &middot; 64</span><div class="bar" style="width: 64px;"></div></div>
</body>
</html>
