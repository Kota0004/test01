<!-- @dsCard group="Colors" viewport="700x170" name="Backgrounds — Ivory" subtitle="紙の質感を持つアイボリー基調。純白 #FFFFFF は使わない" -->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
body { margin: 0; padding: 18px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.chip .swatch { height: 84px; border-radius: var(--radius-sm); border: 1px solid var(--border); }
.chip .name { margin-top: 8px; font-size: 0.78rem; font-weight: 500; }
.chip .hex { font-family: var(--font-mono); font-size: 0.68rem; letter-spacing: 0.06em; color: var(--ink-300); text-transform: uppercase; }
</style>
</head>
<body>
<div class="chip"><div class="swatch" style="background: var(--ivory-50);"></div><div class="name">Ivory 50 — bg-primary</div><div class="hex">#FAF9F5</div></div>
<div class="chip"><div class="swatch" style="background: var(--ivory-100);"></div><div class="name">Ivory 100 — bg-secondary</div><div class="hex">#F0EEE6</div></div>
<div class="chip"><div class="swatch" style="background: var(--ivory-200);"></div><div class="name">Ivory 200 — border</div><div class="hex">#E8E6DC</div></div>
</body>
</html>
