<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
body { margin: 0; padding: 24px 28px; }
p.body { max-width: 34em; margin: 0; }
p.secondary { color: var(--text-secondary); font-size: var(--text-small); max-width: 40em; margin: 10px 0 0; }
.spec { margin-top: 14px; font-family: var(--font-mono); font-size: 0.66rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-300); }
</style>
</head>
<body>
<p class="body">本文は 16px、行間は 1.8。和文の可読性を最優先に、ひらがなの多い文章でも息ができる組みにする。</p>
<p class="secondary">補助テキストは Ink 500(#5E5D59)、14px。色ではなくサイズとウェイトで階層を作る。</p>
<p class="spec">Body — 16 / sans 400 / lh 1.8 &middot; font-feature-settings: "palt"</p>
</body>
</html>
