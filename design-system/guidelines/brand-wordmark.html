<!-- @dsCard group="Brand" viewport="700x190" name="Wordmark" subtitle="ロゴ画像は存在しない — セリフの活字 + ✻ で組む" -->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
body { margin: 0; padding: 26px 28px; display: flex; flex-direction: column; gap: 14px; }
.wordmark { font-family: var(--font-display); font-size: 44px; font-weight: 600; letter-spacing: -0.01em; line-height: 1; }
.wordmark sup { font-size: 0.42em; color: var(--accent); margin-left: 4px; }
.note { font-size: 0.78rem; color: var(--text-secondary); line-height: 1.7; border-top: 1px solid var(--border); padding-top: 12px; max-width: 44em; }
</style>
</head>
<body>
<div class="wordmark">Claude Design<sup>&#10035;</sup></div>
<p class="note">ブランドマークは活字のワードマークのみ。✻(U+2733)がアクセント記号として eyebrow・区切り・引用符の代わりに登場する。画像ロゴを描かないこと。</p>
</body>
</html>
